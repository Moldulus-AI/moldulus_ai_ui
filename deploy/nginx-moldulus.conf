# /etc/nginx/sites-available/moldulus
# Replace YOUR_DOMAIN (or use "_" to answer on the server IP).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 25m;   # image attachments

    # ---- Optional: protect the whole site with a password while testing ----
    # sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd yourname
    # auth_basic           "Moldulus";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Streaming AI endpoint: buffering MUST be off or tokens arrive in one lump.
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite (not append) so clients can't spoof their IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;   # slow CPU generations can take minutes
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
